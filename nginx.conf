log_format raynews '$remote_addr "$request" $status $body_bytes_sent '
                   'rt=$request_time ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    access_log /dev/stdout raynews;
    error_log /dev/stderr warn;

    # Debian's stock nginx.conf only enables `gzip on` with the default type
    # (text/html) — the JSON API responses (/api/news, /sources, …) and the
    # manifest would go out uncompressed. Compress text-based types explicitly.
    # Binary image/video types are intentionally excluded (already compressed).
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;

    include /etc/nginx/snippets/raynews-security-headers.conf;
    proxy_hide_header Access-Control-Allow-Origin;

    location /news.json {
        alias /app/data/news.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/raynews-security-headers.conf;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }

    location /img-proxy {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /img-cache {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8082/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /avatars/ {
        alias /app/data/avatars/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }

    location /favorites {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Includes both GET /notifications and POST /notifications/<id>/read.
    # Without this proxy, the catch-all static location returns index.html;
    # the browser then fails to parse that HTML as notification JSON.
    location /notifications {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:8082/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /settings {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sources {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /articles {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/raynews-security-headers.conf;
    }
}
