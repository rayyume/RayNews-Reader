services:
  raynews:
    # 本地测试：使用 build: . 基于当前代码构建镜像
    # 生产部署：注释 build 行，取消注释 image 行以拉取预构建镜像
    # Beta 测试：使用 ghcr.io/rayyume/raynews:dev
    build: .
    # image: ghcr.io/rayyume/raynews:latest
    container_name: raynews
    ports:
      - "8090:80"
    volumes:
      - ./data:/app/data
    environment:
      # 必填：数据源与站点对外地址
      # 推荐用 TELEGRAM_CHANNEL_URL 指定完整频道链接（域名可换成镜像域名，无需改代码）
      - TELEGRAM_CHANNEL_URL=${TELEGRAM_CHANNEL_URL:-}
      # 旧配置方式（仅指定频道名，域名固定为 t.me），未设置 TELEGRAM_CHANNEL_URL 时生效
      - TELEGRAM_CHANNEL=${TELEGRAM_CHANNEL:-your_channel}
      - RAYNEWS_PUBLIC_URL=${RAYNEWS_PUBLIC_URL:?请填写 RayNews 对外访问地址，例如 https://news.example.com}

      # 核心运行配置
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Shanghai}
      - DATA_DIR=/app/data
      - RAYNEWS_SECRET=${RAYNEWS_SECRET:-}
      - RAYNEWS_TOKEN_EXPIRY_SECONDS=${RAYNEWS_TOKEN_EXPIRY_SECONDS:-2592000}
      - MEMORY_MONITOR_ENABLED=${MEMORY_MONITOR_ENABLED:-true}
      - MEMORY_MONITOR_INTERVAL_SECONDS=${MEMORY_MONITOR_INTERVAL_SECONDS:-60}
      - MEMORY_WARN_MB=${MEMORY_WARN_MB:-768}
      - ARTICLE_DETAIL_CACHE_MAX_ITEMS=${ARTICLE_DETAIL_CACHE_MAX_ITEMS:-256}
      - ARTICLE_DETAIL_CACHE_MAX_MB=${ARTICLE_DETAIL_CACHE_MAX_MB:-64}

      # AI 与邮件配置
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-300}
      # 推理模型可能先消耗隐藏推理 token；短任务也需要足够的输出预算
      - AI_SOURCE_CLASSIFY_MAX_TOKENS=${AI_SOURCE_CLASSIFY_MAX_TOKENS:-2048}
      - AI_SUMMARY_MAX_TOKENS=${AI_SUMMARY_MAX_TOKENS:-4096}
      - AI_TITLE_MAX_TOKENS=${AI_TITLE_MAX_TOKENS:-4096}
      - SYSTEM_AI_FAILURE_ALERT_THRESHOLD=${SYSTEM_AI_FAILURE_ALERT_THRESHOLD:-3}
      - SYSTEM_AI_RECOVERY_STABILITY_SECONDS=${SYSTEM_AI_RECOVERY_STABILITY_SECONDS:-3600}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RAYNEWS_ADMIN_EMAIL=${RAYNEWS_ADMIN_EMAIL:-}
      - RAYNEWS_FROM_EMAIL=${RAYNEWS_FROM_EMAIL:-onboarding@resend.dev}

      # 后台自动任务
      - AUTO_SUMMARY_BATCH_LIMIT=${AUTO_SUMMARY_BATCH_LIMIT:-20}
      - AUTO_SUMMARY_INTERVAL_SECONDS=${AUTO_SUMMARY_INTERVAL_SECONDS:-30}
      - AUTO_TRANSLATION_BATCH_LIMIT=${AUTO_TRANSLATION_BATCH_LIMIT:-5}
      - AUTO_TRANSLATION_INTERVAL_SECONDS=${AUTO_TRANSLATION_INTERVAL_SECONDS:-30}
      - AUTO_SOURCE_CLASSIFY_BATCH_LIMIT=${AUTO_SOURCE_CLASSIFY_BATCH_LIMIT:-20}
      - AUTO_SOURCE_CLASSIFY_INTERVAL_SECONDS=${AUTO_SOURCE_CLASSIFY_INTERVAL_SECONDS:-120}

      # 图片缓存配置（容量单位：MB）
      - IMAGE_CACHE_ENABLED=${IMAGE_CACHE_ENABLED:-true}
      - IMAGE_CACHE_MAX_MB=${IMAGE_CACHE_MAX_MB:-5120}
      - IMAGE_CACHE_MAX_FILE_MB=${IMAGE_CACHE_MAX_FILE_MB:-10}
      - IMAGE_CACHE_PREFETCH_BODY_LIMIT=${IMAGE_CACHE_PREFETCH_BODY_LIMIT:-3}
      - IMAGE_CACHE_PREFETCH_WORKERS=${IMAGE_CACHE_PREFETCH_WORKERS:-2}
      - IMAGE_CACHE_PREFETCH_QUEUE_SIZE=${IMAGE_CACHE_PREFETCH_QUEUE_SIZE:-3000}

      # 页面自定义注入
      - CUSTOM_HEAD_HTML=${CUSTOM_HEAD_HTML:-}

      # 代理配置（通过 .env 注入，按需）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      - TRUSTED_PROXY_PREFIXES=${TRUSTED_PROXY_PREFIXES:-}
    # extra_hosts 按需在 .env 中配置，默认注释
    # extra_hosts:
    #  - "host.docker.internal:${HOST_IP:-}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          [urllib.request.urlopen(url, timeout=2).read() for url in
          ('http://127.0.0.1/health',
          'http://127.0.0.1:8082/auth/health',
          'http://127.0.0.1:8081/refresh/status')]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
